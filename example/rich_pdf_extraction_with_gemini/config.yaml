hf_configuration:
  hf_dataset_name: rich-pdf-extraction-with-gemini
  push_to_hub: false
  upload_card: false
  private: true
  local_saving: true
  local_dataset_dir: ./output/datasets
  export_jsonl: true
  jsonl_export_dir: ./output/jsonl
model_list:
- model_name: $YOURBENCH_MODEL
  base_url: $YOURBENCH_BASE_URL
  api_key: $YOURBENCH_API_KEY
  max_concurrent_requests: 4
pipeline:
  ingestion:
    llm_ingestion: true
    source_documents_dir: ../sample_pdf
    output_dir: ./output/processed
    supported_file_extensions:
    - .pdf
  summarization: null
  chunking:
    l_max_tokens: 96
    token_overlap: 16
    h_min: 2
    h_max: 3
  single_hop_question_generation: null
  multi_hop_question_generation: null
  prepare_lighteval: {}
  citation_score_filtering: null
